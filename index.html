<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#ff9abf">
<title>Mochi Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif}
body{min-height:100vh;background:#ffd6e7;display:flex;justify-content:center;align-items:center;padding:16px}
.phone{width:100%;max-width:390px;background:white;border-radius:40px;padding:24px;border:8px solid #2d2d2d;box-shadow:0 25px 60px rgba(0,0,0,.15)}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:26px;line-height:1}.top p{font-size:13px;color:#bbb}
.bubble{text-align:center;font-size:42px;margin:12px 0}
.badge{background:#2d2d2d;color:white;text-align:center;padding:8px;border-radius:20px;font-size:12px;margin-bottom:16px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#ffb3cc;font-weight:600;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;display:flex;justify-content:center;align-items:center;border-radius:16px;font-size:14px;background:#fff0f5}
.day.today{background:#ff9abf;color:white;font-weight:600;box-shadow:0 6px 15px rgba(255,154,191,.6);transform:scale(1.08)}
.day.empty{background:transparent}
.footer{margin-top:20px;background:#2d2d2d;color:white;border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.btn{border:none;background:#ffe2ec;width:36px;height:36px;border-radius:12px;font-size:20px;cursor:pointer}
#clock{font-size:22px;font-weight:600}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div><h1 id="month"></h1><p id="year"></p></div>
    <div><button class="btn" onclick="ganti(-1)">‹</button> <button class="btn" onclick="ganti(1)">›</button></div>
  </div>
  <div class="bubble">ฅ^•ﻌ•^ฅ ♡</div>
  <div class="badge" id="badge">Loading...</div>
  <div class="weekdays"><div>M</div><div>S</div><div>S</div><div>R</div><div>K</div><div>J</div><div>S</div></div>
  <div class="days" id="days"></div>
  <div class="footer"><div>Mochi Time<br><span id="clock">00:00:00</span></div><div style="font-size:24px">📅</div></div>
</div>
<script>
const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
let d=new Date(), m=d.getMonth(), y=d.getFullYear();
function render(){
  const first=new Date(y,m,1).getDay(), tot=new Date(y,m+1,0).getDate(), today=new Date();
  document.getElementById('month').innerText=bulan[m]; document.getElementById('year').innerText=y;
  document.getElementById('badge').innerText=`Hari ini ${today.getDate()} ${bulan[today.getMonth()]} - Semangat ya!`;
  let h=""; for(let i=0;i<first;i++) h+=`<div class="day empty"></div>`;
  for(let i=1;i<=tot;i++){ let t=i===today.getDate()&&m===today.getMonth()&&y===today.getFullYear(); h+=`<div class="day ${t?'today':''}">${i}</div>` }
  document.getElementById('days').innerHTML=h;
}
function ganti(s){m+=s; if(m<0){m=11;y--} if(m>11){m=0;y++} render()}
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString('id-ID')},1000);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
  </html>
